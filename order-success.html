<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Success | BALENN</title>

<style>
:root{
    --ivory:#faf6f1;
    --cream:#f3ebe4;
    --pink:#d8aaa9;
    --pink-soft:#ead2d0;
    --gold:#b79b72;
    --gold-light:#d8c5a5;
    --orange:#c98e72;
    --charcoal:#302b2a;
    --muted:#827875;
    --line:#e5dcd5;
    --white:#ffffff;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;
    background:var(--ivory);
    color:var(--charcoal);

    display:flex;
    flex-direction:column;
}

/* =========================
   HEADER
========================= */

header{
    height:78px;
    background:rgba(250,246,241,.97);
    border-bottom:1px solid var(--line);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 5%;

    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    color:var(--charcoal);
    text-decoration:none;

    font-size:28px;
    font-weight:700;
    letter-spacing:4px;
}

nav{
    display:flex;
    align-items:center;
    gap:24px;
}

nav a{
    text-decoration:none;
    color:var(--charcoal);

    font-size:12px;
    letter-spacing:1px;

    transition:.2s;
}

nav a:hover{
    color:var(--gold);
}

.header-icons{
    display:flex;
    align-items:center;
    gap:14px;
}

.header-icon{
    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;

    color:var(--charcoal);
    font-size:21px;

    border-radius:50%;

    transition:.2s;
}

.header-icon:hover{
    background:var(--pink-soft);
}

.menu-btn{
    display:none;
    border:0;
    background:none;
    cursor:pointer;
}

/* =========================
   SUCCESS
========================= */

.success-page{
    flex:1;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:60px 20px;
}

.success-card{
    width:100%;
    max-width:620px;

    background:var(--white);

    border:1px solid var(--line);

    padding:55px 45px;

    text-align:center;

    box-shadow:0 15px 45px rgba(48,43,42,.06);
}

.success-icon{
    width:82px;
    height:82px;

    margin:0 auto 25px;

    border-radius:50%;

    background:var(--pink-soft);

    color:var(--gold);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:40px;
    font-weight:bold;
}

.eyebrow{
    color:var(--gold);

    font-size:11px;
    letter-spacing:4px;

    margin-bottom:12px;
}

h1{
    font-size:36px;
    letter-spacing:2px;

    margin-bottom:12px;
}

.message{
    color:var(--muted);

    font-size:14px;

    line-height:1.8;

    margin-bottom:30px;
}

.order-box{
    background:var(--ivory);

    border:1px solid var(--line);

    padding:20px;

    margin-bottom:28px;
}

.order-label{
    color:var(--muted);

    font-size:10px;
    letter-spacing:2px;

    margin-bottom:8px;
}

.order-number{
    font-size:20px;
    font-weight:700;
    letter-spacing:1px;

    color:var(--charcoal);

    word-break:break-word;
}

.redirect-text{
    color:var(--muted);

    font-size:12px;

    margin-bottom:20px;
}

.progress{
    width:100%;
    height:3px;

    background:var(--cream);

    overflow:hidden;

    margin-bottom:28px;
}

.progress-bar{
    width:0;
    height:100%;

    background:var(--gold);

    animation:progress 1.8s linear forwards;
}

@keyframes progress{
    from{
        width:0;
    }

    to{
        width:100%;
    }
}

.actions{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
}

.action-btn{
    min-width:190px;

    padding:14px 22px;

    text-decoration:none;

    font-size:12px;
    letter-spacing:1px;

    border:1px solid var(--charcoal);

    transition:.2s;
}

.action-primary{
    background:var(--charcoal);
    color:var(--white);
}

.action-primary:hover{
    background:var(--gold);
    border-color:var(--gold);
}

.action-secondary{
    background:transparent;
    color:var(--charcoal);
}

.action-secondary:hover{
    background:var(--pink-soft);
    border-color:var(--pink-soft);
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    nav{
        display:none;
    }

    .menu-btn{
        display:flex;
    }
}

@media(max-width:600px){

    header{
        height:70px;
        padding:0 18px;
    }

    .logo{
        font-size:23px;
    }

    .success-page{
        padding:35px 15px;
    }

    .success-card{
        padding:40px 22px;
    }

    h1{
        font-size:29px;
    }

    .success-icon{
        width:72px;
        height:72px;
        font-size:34px;
    }

    .order-number{
        font-size:17px;
    }

    .action-btn{
        width:100%;
    }
}
</style>

</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

```
<a href="index.html" class="logo">
    BALENN
</a>

<nav>
    <a href="index.html">HOME</a>
    <a href="shop.html">NEW ARRIVALS</a>
    <a href="shop.html">CLOTHING</a>
    <a href="shop.html">DRESSES</a>
    <a href="shop.html">TOPS</a>
    <a href="shop.html">BOTTOMS</a>
    <a href="shop.html">BAGS</a>
    <a href="shop.html">SALE</a>
</nav>

<div class="header-icons">

    <a
        href="order-history.html"
        class="header-icon"
        title="Order History"
    >
        ♡
    </a>

    <a
        href="cart.html"
        class="header-icon"
        title="Shopping Bag"
    >
        🛍️
    </a>

    <button
        class="header-icon menu-btn"
        type="button"
    >
        ☰
    </button>

</div>
```

</header>

<!-- =========================
     SUCCESS PAGE
========================= -->

<main class="success-page">

```
<section class="success-card">

    <div class="success-icon">
        ✓
    </div>

    <div class="eyebrow">
        ORDER COMPLETED
    </div>

    <h1>
        สั่งซื้อสำเร็จแล้ว
    </h1>

    <p class="message">
        ขอบคุณสำหรับการสั่งซื้อกับ BALENN
        <br>
        ระบบบันทึกคำสั่งซื้อของคุณเรียบร้อยแล้ว
    </p>


    <div class="order-box">

        <div class="order-label">
            ORDER NUMBER
        </div>

        <div
            id="orderNumber"
            class="order-number"
        >
            -
        </div>

    </div>


    <p class="redirect-text">
        กำลังนำคุณไปยังใบเสร็จ...
    </p>


    <div class="progress">
        <div class="progress-bar"></div>
    </div>


    <div class="actions">

        <a
            id="receiptBtn"
            href="receipt.html"
            class="action-btn action-primary"
        >
            ดูใบเสร็จ
        </a>

        <a
            href="order-history.html"
            class="action-btn action-secondary"
        >
            ดูประวัติคำสั่งซื้อ
        </a>

    </div>

</section>
```

</main>

<script>

document.addEventListener("DOMContentLoaded", function(){

    const ORDER_KEY = "balennOrderHistory";
    const LAST_ORDER_KEY = "balennLastOrder";


    /* =========================
       GET ORDER NUMBER FROM URL
    ========================= */

    const params =
        new URLSearchParams(
            window.location.search
        );

    let orderNumber =
        params.get("order");


    /* =========================
       FALLBACK: LAST ORDER
    ========================= */

    if(!orderNumber){

        try{

            const lastOrder =
                JSON.parse(
                    localStorage.getItem(
                        LAST_ORDER_KEY
                    )
                );

            if(lastOrder){

                orderNumber =
                    lastOrder.orderNumber ||
                    lastOrder.orderId ||
                    "";

            }

        }catch(error){

            orderNumber = "";

        }

    }


    /* =========================
       FALLBACK: ORDER HISTORY
    ========================= */

    if(!orderNumber){

        try{

            const history =
                JSON.parse(
                    localStorage.getItem(
                        ORDER_KEY
                    )
                ) || [];

            if(
                Array.isArray(history) &&
                history.length
            ){

                const latest =
                    history[0];

                orderNumber =
                    latest.orderNumber ||
                    latest.orderId ||
                    "";

            }

        }catch(error){

            orderNumber = "";

        }

    }


    /* =========================
       DISPLAY ORDER NUMBER
    ========================= */

    const orderNumberElement =
        document.getElementById(
            "orderNumber"
        );


    if(orderNumber){

        orderNumberElement.textContent =
            orderNumber;

    }else{

        orderNumberElement.textContent =
            "ORDER COMPLETED";

    }


    /* =========================
       RECEIPT LINK
    ========================= */

    const receiptBtn =
        document.getElementById(
            "receiptBtn"
        );


    if(orderNumber){

        receiptBtn.href =
            "receipt.html?order=" +
            encodeURIComponent(
                orderNumber
            );

    }else{

        receiptBtn.href =
            "receipt.html";

    }


    /* =========================
       AUTO REDIRECT
    ========================= */

    setTimeout(function(){

        if(orderNumber){

            window.location.href =
                "receipt.html?order=" +
                encodeURIComponent(
                    orderNumber
                );

        }else{

            window.location.href =
                "receipt.html";

        }

    },1800);

});

</script>

</body>
</html>
